<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><title>NodeMCU microphone alert servo and fused 5V lamp relay</title><rect width="1100" height="700" fill="white"/><g font-family="sans-serif" font-size="18" fill="#123"><text x="25" y="35">ID12 • NodeMCU v2 • logic 3.3V • demonstration only</text><rect x="45" y="100" width="320" height="400" fill="#e7f4fa" stroke="#123"/><text x="65" y="140">NodeMCU ESP8266</text><text x="65" y="200">3V3 → microphone VCC</text><text x="65" y="260">A0 ←mic analog OUT ≤3.3V</text><text x="65" y="320">D1 / GPIO5 →relay IN</text><text x="65" y="380">D2 / GPIO4 →servo signal</text><text x="65" y="440">GND →common ground</text><rect x="670" y="95" width="385" height="105" fill="#eef8ee" stroke="#123"/><text x="690" y="125">3.3V analog microphone</text><text x="690" y="155">VCC →3V3; OUT →A0</text><text x="690" y="185">GND →common GND</text><rect x="670" y="240" width="385" height="120" fill="#eef8ee" stroke="#123"/><text x="690" y="270">Active-high 3.3V-compatible relay</text><text x="690" y="305">VCC →external5V; IN →D1</text><text x="690" y="335">10kΩ IN→GND; GND common</text><rect x="670" y="395" width="385" height="100" fill="#eef8ee" stroke="#123"/><text x="690" y="425">SG90 pointer servo only</text><text x="690" y="455">Red →external5V; signal →D2</text><text x="690" y="485">Brown →common GND</text><text x="25" y="550">External regulated5V →1A fuse →relay COM; NO →5V LED lamp+; lamp− →GND.</text><text x="25" y="590">External5V feeds servo/relay VCC; 470µF capacitor across servo supply. NC unused.</text><text x="25" y="630">NodeMCU powered by USB. External5V GND joins NodeMCU GND; never tie to3V3.</text><text x="25" y="670">No lock, door drive or mains load. MQTT→HA mobile app; HA→Matterbridge→Matter.</text></g><g fill="none" stroke="#287496" stroke-width="3"><path d="M365 255 H550 V155 H670"/><path d="M365 315 H670"/><path d="M365 375 H580 V450 H670"/><path d="M365 435 H560 V510 H1060"/></g></svg>